# Local Postgres for the Postgres tests: `docker compose up -d`
#   postgresql://sentinel:sentinel@localhost:5432/sentinel?table=<name>
# CI starts its own Postgres with the same credentials. Tests create their
# own tables.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5
