# Policy for `sentinel validate orders`.
#
# If the schema rule reports order_total as `float` instead of `decimal`,
# that's DuckDB's inferred type: change `decimal` to `float` below.
dataset: orders
rules:
  - name: row_count
    type: row_count
    threshold:
      strategy: static
      min: 1000
  - name: customer_id_not_null
    type: null_rate
    column: customer_id
    threshold:
      strategy: static
      max: 0.01
  - name: unique_order_id
    type: uniqueness
    column: order_id
    threshold:
      strategy: static
      max: 0
  - name: orders_freshness
    type: freshness
    column: updated_at
    threshold:
      strategy: static
      max: 60
  - name: orders_schema
    type: schema
    expected_schema:
      order_id: integer
      customer_id: string
      order_total: decimal
      updated_at: timestamp
    threshold:
      strategy: static
      max: 0
