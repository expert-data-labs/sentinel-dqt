# Three-rule subset of orders.yaml (row_count, null_rate, uniqueness),
# used by the end-to-end integration tests.
dataset: orders
rules:
  - name: row_count
    type: row_count
    threshold:
      strategy: static
      min: 1000
  - name: customer_id_not_null
    type: null_rate
    column: customer_id
    threshold:
      strategy: static
      max: 0.01
  - name: unique_order_id
    type: uniqueness
    column: order_id
    threshold:
      strategy: static
      max: 0
