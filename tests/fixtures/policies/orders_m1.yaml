# Milestone 1's subset of orders.yaml: the same dataset and the same three
# rule types Milestone 1 actually implements (row_count, null_rate,
# uniqueness). orders.yaml itself is left as the PRD's full four-rule
# example (it also declares a `freshness` rule) for the policy loader's own
# tests — that rule type has no Rule implementation until Milestone 3, so
# running orders.yaml itself through a real ValidationOrchestrator would
# raise RuleNotRegisteredError today. This fixture is what Milestone 1's
# end-to-end integration test runs instead.
dataset: orders
rules:
  - name: row_count
    type: row_count
    threshold:
      strategy: static
      min: 1000
  - name: customer_id_not_null
    type: null_rate
    column: customer_id
    threshold:
      strategy: static
      max: 0.01
  - name: unique_order_id
    type: uniqueness
    column: order_id
    threshold:
      strategy: static
      max: 0
