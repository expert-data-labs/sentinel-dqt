name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Databases for the store and adapter tests (same credentials as
    # docker-compose.yml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sentinel
          MYSQL_USER: sentinel
          MYSQL_PASSWORD: sentinel
          MYSQL_ROOT_PASSWORD: sentinel
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usentinel -psentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SENTINEL_TEST_POSTGRES_DSN: postgresql://sentinel:sentinel@localhost:5432/sentinel
      # Store tests fail (rather than skip) if Postgres is unreachable.
      SENTINEL_REQUIRE_POSTGRES: "1"
      # Adapter contract tests fail (rather than skip) for these backends.
      SENTINEL_REQUIRE_BACKENDS: duckdb-csv,duckdb-parquet,postgres,mysql,mongodb
      # Test on the minimum supported Python.
      UV_PYTHON: "3.11"

    steps:
      # Node 24 action versions. setup-uv has no major tags since v8.
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # --locked: fail if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
