name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Milestone 3: PostgresDataSource's tests need a real Postgres to run
    # against. Same credentials as docker-compose.yml's local service, so
    # SENTINEL_TEST_POSTGRES_DSN below is identical whether a contributor
    # runs the suite locally (with `docker compose up -d` first) or in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SENTINEL_TEST_POSTGRES_DSN: postgresql://sentinel:sentinel@localhost:5432/sentinel
      # Pin the interpreter every `uv` command uses to the project's floor
      # (requires-python >= 3.11), so CI catches 3.12+-only syntax/APIs.
      UV_PYTHON: "3.11"

    steps:
      # checkout@v5+ and setup-uv@v7+ run on Node 24. setup-uv stopped
      # publishing floating major tags at v8, so it is pinned to an exact
      # release. The old setup-uv@v3 also used the retired cache service,
      # which is what produced "Cache service responded with 400".
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # instead of silently re-resolving dependencies in CI.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
