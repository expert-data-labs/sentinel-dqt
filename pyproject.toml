[project]
name = "sentinel"
version = "0.1.0"
description = "A configurable data reliability and threshold intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # DuckDB data source and Sentinel's own store.
    "duckdb>=1.0",
    # Needed by duckdb to read TIMESTAMPTZ values back as aware datetimes.
    "pytz>=2024.1",
    "typer>=0.12",
    # Postgres: Sentinel's store and a data source. [binary] avoids needing a local libpq.
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    # Schema migrations for the store (raw SQL; SQLAlchemy is only Alembic's driver).
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.scripts]
sentinel = "sentinel.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Optional dashboard (dashboard/app.py): uv sync --group dashboard
dashboard = [
    "streamlit>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sentinel", "tests"]
strict = true
plugins = ["pydantic.mypy"]
