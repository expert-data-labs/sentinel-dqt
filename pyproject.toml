[project]
name = "sentinel"
version = "0.1.0"
description = "A configurable data reliability and threshold intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Milestone 0 only needs the config-boundary layer; concrete adapters
    # (duckdb) and the CLI (typer) are added when the tasks that need them
    # land, not speculatively.
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Milestone 2: DuckDBSource (the data source adapter) and, for now, the
    # persistence store itself both use duckdb — see
    # docs/architecture/0003-milestone-2-architecture.md Part 3.
    "duckdb>=1.0",
    # duckdb's Python client needs pytz at runtime to convert a fetched
    # TIMESTAMPTZ column back into a timezone-aware Python datetime — an
    # implicit dependency of duckdb itself, not something this project's
    # own code imports. Discovered via `sentinel history`'s real query
    # against started_at (TIMESTAMPTZ); writing TIMESTAMPTZ values
    # (persistence/writer.py) doesn't hit this path, only reading them
    # back out does.
    "pytz>=2024.1",
    # Milestone 2: the `sentinel` CLI itself.
    "typer>=0.12",
    # Milestone 3: PostgresDataSource. v3 (psycopg, not psycopg2) with
    # the [binary] extra so contributors don't need a local libpq/
    # build toolchain just to run `uv sync` -- see
    # docs/architecture/0004-milestone-3-architecture.md, Open Questions.
    "psycopg[binary]>=3.1",
]

[project.scripts]
sentinel = "sentinel.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sentinel", "tests"]
strict = true
plugins = ["pydantic.mypy"]
